name: Hourly Autonomous Live Pulse Ingestion

on:
  schedule:
    # Trigger at minute 0 of every hour (24/7)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  ingest-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run autonomous live fetch & sentiment scoring
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python run.py --fetch

      - name: Commit and push updated live data to repository & GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Live Pulse]"
          git add data/pulse.db data/collected_posts.json docs/pulse_data.json docs/index.html
          if git diff-index --quiet HEAD --; then
            echo "No new commuter posts fetched this hour."
          else
            git commit -m "chore(live-pulse): hourly live stream sync [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
